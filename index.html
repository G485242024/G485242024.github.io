<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>わたなべのポートフォリオ</title>
  <style>
    /* 黒を基調に、レトロゲーム風の配色と等幅フォントを設定 */
    :root {
      color-scheme: dark;
      --background: #08090b;
      --panel: #111419;
      --text: #f2f4f6;
      --muted: #bac3ce;
      --green: #a6f77b;
      --yellow: #ffdb76;
      --border: #3d4945;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: var(--background);
      /* 細い横線で、昔のゲーム画面のような質感を出す */
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0 5px,
        #ffffff07 5px 6px
      );
      color: var(--text);
      font-family: ui-monospace, "Courier New", monospace;
      line-height: 1.7;
    }

    /* ページの横幅を制限し、左右に余白を取る */
    .page {
      width: min(100% - 2rem, 54rem);
      margin-inline: auto;
      padding-block: clamp(2rem, 7vw, 5rem);
    }

    /* 名前とキャッチコピーをゲームのタイトル画面風に表示 */
    .profile {
      padding: clamp(1.25rem, 5vw, 3rem);
      border: 3px solid var(--green);
      background-color: var(--panel);
      box-shadow: 5px 5px 0 #304328;
    }

    .affiliation {
      margin: 0;
      color: var(--muted);
    }

    h1 {
      margin: 0.15em 0 0.3em;
      color: var(--green);
      font-size: clamp(2.25rem, 8vw, 4.5rem);
      line-height: 1.2;
      text-shadow: 3px 3px 0 #304328;
    }

    .catchphrase {
      margin: 0;
      color: var(--yellow);
    }

    /* 各項目をゲームのメニューのような角張ったパネルにする */
    .sections {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .panel {
      padding: 1.25rem;
      border: 2px solid var(--border);
      background-color: var(--panel);
    }

    .panel h2 {
      margin: 0 0 0.75rem;
      padding-left: 0.65rem;
      border-left: 0.35rem solid var(--green);
      color: var(--green);
      font-size: 1.125rem;
    }

    .panel p {
      margin: 0;
    }

    /* 趣味や言語を枠で囲み、幅に合わせて折り返す */
    .items {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .items li {
      padding: 0.2rem 0.65rem;
      border: 1px solid var(--border);
      background-color: var(--background);
    }

    /* スマートフォンでは各パネルを縦一列に並べる */
    @media (max-width: 38rem) {
      .sections {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <!-- 基本情報とキャッチコピー -->
    <header class="profile">
      <p class="affiliation">拓殖大学工学部・3年</p>
      <h1>わたなべ</h1>
      <p class="catchphrase">休みの日は昼まで寝ています。</p>
    </header>

    <!-- 自己紹介の各項目 -->
    <div class="sections">
      <!-- 趣味・好きなこと -->
      <section class="panel">
        <h2>趣味・好きなこと</h2>
        <ul class="items" role="list">
          <li>ゲーム</li>
          <li>カラオケ</li>
        </ul>
      </section>

      <!-- 使ったことのある言語 -->
      <section class="panel">
        <h2>プログラミング経験</h2>
        <ul class="items" role="list">
          <li>Java</li>
          <li>HTML</li>
          <li>CSS</li>
        </ul>
      </section>

      <!-- 授業で学びたいこと -->
      <section class="panel">
        <h2>この授業で学びたいこと</h2>
        <p>OSSの基本的な情報</p>
      </section>

      <!-- 最後のひとこと -->
      <section class="panel">
        <h2>ひとこと</h2>
        <p>最近とても寒い</p>
      </section>
    </div>
  </main>
</body>
</html>
